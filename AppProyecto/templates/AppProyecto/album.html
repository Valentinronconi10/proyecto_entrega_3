<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Álbum</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-lg">
                    <div class="card-header bg-primary text-white">
                        <h2 class="mb-0"><i class="bi bi-disc"></i> Detalle de Álbum</h2>
                    </div>
                    <div class="card-body">
                        <h3 class="card-title text-primary">{{ album.titulo }}</h3>
                        <p class="mb-2">
                            <span class="badge bg-secondary">Titulo</span>
                            <span class="ms-2">{{ album.artista.titulo }}</span>
                        </p>
                        <p class="mb-2">
                            <span class="badge bg-secondary">Artista</span>
                            <span class="ms-2">{{ album.artista.nombre }}</span>
                        </p>
                        <p class="mb-2">
                            <span class="badge bg-info text-dark">Fecha de Lanzamiento</span>
                            <span class="ms-2">{{ album.fecha_lanzamiento }}</span>
                        </p>
                        <p>
                            <span class="badge bg-success">Género</span>
                            <span class="ms-2">{{ album.genero }}</span>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS (opcional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Iconos Bootstrap (opcional, para el ícono de disco) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</body>
</html>
