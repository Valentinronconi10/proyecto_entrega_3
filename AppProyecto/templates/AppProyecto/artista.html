<!DOCTYPE html>
<html lang="es">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artista | Mi Proyecto</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons (opcional para íconos) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Mi Proyecto</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <!-- Contenido principal -->
    <div class="container mt-5">
        <div class="text-center mb-5">
            <h1 class="display-3 fw-bold text-primary mb-3">
                <i class="bi bi-person-music"></i> Artistas
            </h1>
            <p class="lead text-secondary">
                Descubre todos los artistas disponibles y explora su música y álbumes destacados.
            </p>
        </div>

        <!-- Cards de artistas de ejemplo -->
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 justify-content-center">
            <div class="col">
                <div class="card h-100 border-0 shadow-lg">
                    <img src="https://via.placeholder.com/400x200?text=Artista+1" class="card-img-top rounded-top" alt="Artista 1">
                    <div class="card-body text-center">
                        <h5 class="card-title fw-bold text-primary">Nombre Artista 1</h5>
                        <p class="card-text text-muted mb-2"><i class="bi bi-music-note-beamed"></i> Género: <span class="badge bg-info text-dark">Pop</span></p>
                        <a href="#" class="btn btn-outline-primary btn-sm mt-2 px-4 rounded-pill">Ver álbumes</a>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card h-100 border-0 shadow-lg">
                    <img src="https://via.placeholder.com/400x200?text=Artista+2" class="card-img-top rounded-top" alt="Artista 2">
                    <div class="card-body text-center">
                        <h5 class="card-title fw-bold text-primary">Nombre Artista 2</h5>
                        <p class="card-text text-muted mb-2"><i class="bi bi-music-note-beamed"></i> Género: <span class="badge bg-warning text-dark">Rock</span></p>
                        <a href="#" class="btn btn-outline-primary btn-sm mt-2 px-4 rounded-pill">Ver álbumes</a>
                    </div>
                </div>
            </div>
            <!-- Puedes agregar más cards dinámicamente aquí -->
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-5 shadow-sm">
        <div class="container">
            <small>&copy; 2024 Mi Proyecto. Todos los derechos reservados.</small>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
