{%extends 'AppProyecto/padre.html'%}
{%load static%}
{%block titulo%}Formulario para crear una Cancion{%endblock titulo%}
{% block contenido %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">
  <div class="card shadow p-4 w-100" style="max-width: 600px;">
    <h2 class="text-center mb-4">Crear una Canción</h2>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <table class="table">
        {{ form.as_table }}
      </table>
      <div class="d-flex justify-content-between">
        <button type="submit" class="btn btn-primary btn-lg px-4">Enviar</button>
        <a href="{% url 'leerCancionesReggaeton' %}" class="btn btn-secondary btn-lg px-4">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock contenido %}
