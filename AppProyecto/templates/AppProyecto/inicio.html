{% extends 'AppProyecto/padre.html' %}
{%load static%}
{% block titulo %}Inicio | Mi Proyecto {% endblock %}

<!-- Contenido principal definido con bloque -->
{% block contenido %}
<div class="container mt-5" id="jumbotron-section">
    <div class="p-5 mb-4 bg-light rounded-3">
        <div class="container-fluid py-5">
            <h1 class="display-5 fw-bold">¡Bienvenido a la presentación de mi Pagina web!</h1>
            <p class="col-md-8 fs-4">Aquí podrás ver un poco de musica.</p>
            <a class="btn btn-primary btn-lg" href="#" role="button" id="comenzar-btn">Comenzar</a>
        </div>
    </div>
</div>

<div class="container mt-5" id="opciones-section" style="display: none;">
    <div class="row justify-content-center">
        <div class="col-md-4 mb-3">
            <a href="{% url 'albumes' %}" class="btn btn-outline-primary w-100">Álbum</a>
        </div>
        <div class="col-md-4 mb-3">
            <a href="{% url 'canciones' %}" class="btn btn-outline-success w-100">Canción</a>
        </div>
        <div class="col-md-4 mb-3">
            <a href="{% url 'artistas' %}" class="btn btn-outline-danger w-100">Artista</a>
        </div>
    </div>
</div>
{% endblock contenido %}
